# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  money-machine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - mm.env
    volumes:
      - mm-state:/data
      - mm-backups:/backups
    ports:
      # bound to localhost only — put a reverse proxy with auth in front if you need remote access
      - "127.0.0.1:8780:8780"   # dashboard
      - "127.0.0.1:8790:8790"   # agent-marketplace API
      - "127.0.0.1:8791:8791"   # analytics-collector — expose publicly via an HTTPS reverse proxy for the studio's beacon
volumes:
  mm-state:
  mm-backups:
